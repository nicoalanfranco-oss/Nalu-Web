name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razón del rebuild (auto-generado por Food System)'
        required: false
        default: 'manual'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Fetch catálogo fresco desde Food backend
        # Descarga el catálogo actualizado del sistema Food (precios, fotos, marcas)
        # Si falla (ej: backend caído), continúa con el nalu_catalog.json commiteado como fallback
        run: |
          echo "📥 Descargando catálogo desde Food backend..."
          HTTP_STATUS=$(curl -s -o /tmp/catalog_raw.json -w "%{http_code}" \
            "https://food--studio-4748759464-52942.us-east4.hosted.app/api/public/catalogo?tenant_id=1&marca_id=1" \
            --max-time 30)
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Catálogo descargado correctamente (HTTP $HTTP_STATUS)"
            # Transformar: API devuelve 'elaborados', el JSON espera 'platos'
            node -e "
              const raw = JSON.parse(require('fs').readFileSync('/tmp/catalog_raw.json', 'utf8'));
              const shaped = {
                tenant: raw.tenant,
                marca: raw.marca,
                platos: raw.elaborados || [],
                reventa: raw.reventa || [],
                gruposOpciones: raw.gruposOpciones || []
              };
              require('fs').writeFileSync('./src/services/nalu_catalog.json', JSON.stringify(shaped, null, 2));
              console.log('📦 nalu_catalog.json actualizado:');
              console.log('   Platos:', shaped.platos.length);
              console.log('   Reventa:', shaped.reventa.length);
              console.log('   GruposOpciones:', shaped.gruposOpciones.length);
              if (shaped.reventa.length > 0) {
                console.log('   Precios reventa:');
                shaped.reventa.forEach(r => console.log('     -', r.nombre, '→ \$' + r.precio_venta));
              }
            "
          else
            echo "⚠️  Food backend no disponible (HTTP $HTTP_STATUS) — usando nalu_catalog.json commiteado como fallback"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
